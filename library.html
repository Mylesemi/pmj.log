<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책과 영화 · pmj.log</title>
  <meta name="description" content="블로그에 남긴 독서·영화 기록 모음">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>p</text></svg>">
  <script>
    // 첫 렌더 전에 저장된 테마 적용 (깜빡임 방지)
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body class="page-library" data-src="library.json">
  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="페이지">
        <a href="./">Tool·자료</a>
        <a href="library.html" aria-current="page">책·영화</a>
      </nav>
    </div>
    <div class="container header-inner">
      <div class="brand">
        <h1 id="profile-name">책과 영화</h1>
        <p id="profile-tagline" class="tagline"></p>
        <div id="profile-links" class="profile-links"></div>
      </div>
      <div class="header-side">
        <div id="stats" class="stats" aria-live="polite"></div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="테마 전환" title="테마 전환">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="featured-section" class="featured-section" hidden>
      <h2 class="section-title">추천</h2>
      <div id="featured" class="featured-grid"></div>
    </section>

    <div class="toolbar" role="search">
      <div class="toolbar-row">
        <div id="category-tabs" class="tabs" role="tablist" aria-label="카테고리"></div>
        <div class="toolbar-controls">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="책·영화 제목이나 내용 검색" aria-label="검색">
          </label>
          <select id="sort" aria-label="정렬">
            <option value="date">최신순</option>
            <option value="title">이름순</option>
          </select>
        </div>
      </div>
      <div id="tag-chips" class="chips" aria-label="태그"></div>
    </div>

    <p id="result-count" class="result-count"></p>
    <div id="grid" class="groups" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>
      <p>조건에 맞는 항목이 없어요.</p>
      <button id="reset" type="button" class="btn">필터 초기화</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><span id="updated"></span></div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
