# 매일 아침 네이버 블로그의 독서·영화 글을 다시 모아 library.json이 바뀌었으면 커밋한다
name: Update library

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch blog posts
        run: python tools/fetch_blog.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- library.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json
          git commit -m "Update library from blog"
          git push
