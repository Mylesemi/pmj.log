name: Update GA4 visitor statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Fetch GA4 statistics
        env:
          GA4_PROPERTY_ID: '564297056'
        run: python scripts/update_analytics.py
      - name: Commit updated statistics
        run: |
          if ! git diff --quiet -- analytics.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analytics.json
            git commit -m "chore: refresh GA4 visitor statistics"
            git push
          fi
