name: Update GA4 visitor statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ga4-analytics.yml
      - scripts/update_analytics.py
      - analytics-sites.json
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
  id-token: write
  pages: write
concurrency:
  group: ga4-analytics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These identifiers are public configuration; authentication uses short-lived OIDC.
    # Repository Variables take precedence when configured.
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || 'projects/412932215004/locations/global/workloadIdentityPools/github-pmj/providers/github' }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'pmj-ga4-reader@pmj-ga4-reader.iam.gserviceaccount.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate keyless authentication settings
        run: |
          missing=0
          for name in GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Authentication setting $name is missing. See GA4_SETUP.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Fetch GA4 statistics
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '564297056' }}
        run: python scripts/update_analytics.py
      - name: Commit updated statistics
        run: |
          if ! git diff --quiet -- analytics.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analytics.json
            git commit -m "chore: refresh GA4 visitor statistics"
            git pull --rebase origin main
            git push
          fi
      # GITHUB_TOKEN pushes do not start the branch-based Pages build.
      - name: Publish updated statistics to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Summarize verified API response
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('analytics.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### GA4 statistics fetched successfully\n\n')
              summary.write(f"Updated: {data['updatedAt']}\n\n")
              summary.write('| Site | 30-day visitors | 30-day views |\n|---|---:|---:|\n')
              for site, stats in data['sites'].items():
                  summary.write(f"| {site} | {stats['days30']['visitors']} | {stats['days30']['views']} |\n")
          PY
