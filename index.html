<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pmj.log</title>
  <meta name="description" content="직접 만든 Tool과 HTML 자료 모음">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23201c1a'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23f5b971' font-family='sans-serif' font-weight='700'>p</text></svg>">
  <script>
    // 첫 렌더 전에 저장된 테마 적용 (깜빡임 방지)
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-src="projects.json" data-view="cards">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="./"><span class="logo-mark" aria-hidden="true">p</span>pmj.log</a>
      <nav class="site-nav" aria-label="페이지">
        <a href="./" aria-current="page">Tool·자료</a>
        <a href="library.html">책·영화</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="테마 전환" title="테마 전환">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="icon-btn" href="https://github.com/Mylesemi" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        </a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <div>
        <p id="hero-eyebrow" class="eyebrow"></p>
        <h1 id="hero-title" class="hero-title"></h1>
        <p id="stats" class="hero-stats" aria-live="polite"></p>
      </div>
      <div class="hero-side">
        <p id="hero-tagline"></p>
        <div id="profile-links" class="hero-links"></div>
      </div>
    </div>
  </section>

  <div class="toolbar" role="search">
    <div class="container">
      <div class="toolbar-row">
        <div id="category-tabs" class="tabs" role="tablist" aria-label="카테고리"></div>
        <div class="toolbar-controls">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="제목, 설명, 태그 검색" aria-label="검색">
          </label>
          <select id="sort" aria-label="정렬">
            <option value="date">최신순</option>
            <option value="title">이름순</option>
          </select>
        </div>
      </div>
      <div id="tag-chips" class="chips" aria-label="태그"></div>
    </div>
  </div>

  <main class="main">
    <div class="container">
      <section id="featured-section" class="featured-section" hidden>
        <h2 class="section-label">추천</h2>
        <div id="featured" class="grid"></div>
      </section>
      <p id="result-count" class="result-count"></p>
      <div id="grid" class="groups" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        <p>조건에 맞는 항목이 없어요.</p>
        <button id="reset" type="button" class="btn">필터 초기화</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><span id="updated"></span></div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
